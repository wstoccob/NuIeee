# Production stack. Postgres and MinIO bind to loopback only and are reached
# through host nginx; the API is published on 127.0.0.1:8080 because that is
# what /etc/nginx/sites-enabled/ieee-api already proxies to.

services:
  migrate:
    image: ghcr.io/${GHCR_OWNER}/nuieee-api:${API_TAG:-latest}
    container_name: nuieee-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/nuieee
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio.ieee.nu
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - nuieee-network

  api:
    image: ghcr.io/${GHCR_OWNER}/nuieee-api:${API_TAG:-latest}
    container_name: nuieee-api
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/nuieee
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-180}
      CORS_ORIGINS: '["https://ieee.nu","https://www.ieee.nu"]'
      MINIO_ENDPOINT: minio.ieee.nu
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: event-photos
      MINIO_SECURE: "true"
      MINIO_PUBLIC_BASE_URL: https://minio.ieee.nu
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - nuieee-network

  db:
    image: postgres:16
    container_name: nuieee-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: nuieee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nuieee-network

  minio:
    image: quay.io/minio/minio
    container_name: nuieee-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SERVER_URL: https://minio.ieee.nu
      MINIO_BROWSER_REDIRECT_URL: https://minio-console.ieee.nu
    volumes:
      - minio_prod_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - nuieee-network

volumes:
  postgres_prod_data:
  minio_prod_data:

networks:
  nuieee-network:
    driver: bridge
