# Local development stack: docker compose up -d
# The API is rebuilt from source; production uses a prebuilt GHCR image.

services:
  api:
    build:
      context: .
    container_name: nuieee-api-dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/nuieee
      JWT_SECRET: dev-secret-not-for-production-min-32-chars
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: event-photos
      MINIO_SECURE: "false"
      MINIO_PUBLIC_BASE_URL: http://localhost:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [nuieee-dev]

  db:
    image: postgres:16
    container_name: nuieee-db-dev
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: nuieee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [nuieee-dev]

  minio:
    image: quay.io/minio/minio
    container_name: nuieee-minio-dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_dev_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [nuieee-dev]

volumes:
  postgres_dev_data:
  minio_dev_data:

networks:
  nuieee-dev:
    driver: bridge
